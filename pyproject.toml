[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-para-decisao"
version = "1.0.0"
description = "Repositório didático de IA para Decisão, ECO e ADM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "nbformat>=5.9", "jupyterlab>=4"]

[project.optional-dependencies]
llm = ["openai>=1.80", "pydantic>=2", "langchain-core>=0.3", "langchain-openai>=0.3", "langchain-chroma>=0.2", "langgraph>=0.3", "chromadb>=0.5"]
tests = ["pytest>=8", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
